<script type="importmap">
{

    "lit": "https://esm.sh/lit@3",
    "lit/": "https://esm.sh/lit@3/",

<script type="module">
    if (localStorage.getItem('theme') == 'dark') {
        document.documentElement.classList.add('wa-dark')
    } else if (localStorage.getItem('theme') === null) {
        localStorage.setItem('theme', 'dark')
        document.documentElement.classList.add('wa-dark')
    }

    if (localStorage.getItem('LDM') === null) localStorage.setItem('LDM', 'true')
    if (localStorage.getItem('selectedServer') === null) localStorage.setItem('selectedServer', 'undefined')
    if (localStorage.getItem('viewType') === null) localStorage.setItem('viewType', 'standard')
    if (localStorage.getItem('toast-placement') === null) localStorage.setItem('toast-placement', 'top-end')
</script>

    <style>
